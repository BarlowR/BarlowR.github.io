{% assign image_extensions = "jpg,jpeg,png,gif,webp" | split: "," %}
{% assign gallery_path = include.imgFolder | default: "/gallery/" %}
{% assign images = site.static_files | where_exp: "file", "file.path contains '/assets/gallery'" | sort, "date" | reverse%}


<div class="gallery-container">
    <div id="gallery" class="gallery">
        <!-- Images will be loaded here dynamically -->
    </div>
</div>

<div id="lightbox" class="lightbox">
    <div class="lightbox-content">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-image" id="lightbox-img" src="" alt="">
        <div class="lightbox-nav">
            <div class="lightbox-prev">&lt;</div>
            <div class="lightbox-next">&gt;</div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Configuration
        const imageFolder = {{ gallery_path }}; // Update this to your Jekyll image folder path
        console.log(imageFolder);
        
        const kSpanMultiplier = 10;
        
        const imageFiles = [
            {% for img in images %}
                {% assign extension = img.path | split: "." | last | downcase %}
                {% if image_extensions contains extension %}
                    "{{ img.path }}",
                {% endif %}
            {% endfor %}
        ];
        console.log(imageFiles);
        
        
        const gallery = document.getElementById('gallery');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxClose = document.querySelector('.lightbox-close');
        const lightboxPrev = document.querySelector('.lightbox-prev');
        const lightboxNext = document.querySelector('.lightbox-next');
        
        let currentImageIndex = 0;
        
        // Load images and calculate layout
        function loadImages() {
            imageFiles.forEach((src, index) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.dataset.index = index;
                
                const img = document.createElement('img');
                img.src = src;
                img.alt = `Gallery image ${index + 1}`;
                
                // When image loads, calculate its height for layout
                img.onload = function() {
                    const height = this.height;
                    const width = this.width;
                    
                    // Calculate how many grid rows this image should span based on aspect ratio
                    const rowSpan = Math.ceil((height * kSpanMultiplier / width)); // Multiplier adjusts density
                    item.style.gridRowEnd = `span ${rowSpan}`;
                };
                
                item.appendChild(img);
                gallery.appendChild(item);
                
                // Open lightbox on click
                item.addEventListener('click', function() {
                    openLightbox(index);
                });
            });
        }
        
        // Lightbox functions
        function openLightbox(index) {
            currentImageIndex = index;
            lightboxImg.src = imageFiles[index];
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden'; // Prevent scrolling when lightbox is open
        }
        
        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
        }
        
        function showPrevImage() {
            currentImageIndex = (currentImageIndex - 1 + imageFiles.length) % imageFiles.length;
            lightboxImg.src = imageFiles[currentImageIndex];
        }
        
        function showNextImage() {
            currentImageIndex = (currentImageIndex + 1) % imageFiles.length;
            lightboxImg.src = imageFiles[currentImageIndex];
        }
        
        // Event listeners for lightbox
        lightboxClose.addEventListener('click', closeLightbox);
        lightboxPrev.addEventListener('click', showPrevImage);
        lightboxNext.addEventListener('click', showNextImage);
        
        lightbox.addEventListener('click', function(e) {
            if (e.target === lightbox) {
                closeLightbox();
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (!lightbox.classList.contains('active')) return;
            
            if (e.key === 'Escape') {
                closeLightbox();
            } else if (e.key === 'ArrowLeft') {
                showPrevImage();
            } else if (e.key === 'ArrowRight') {
                showNextImage();
            }
        });
        
        // Initialize gallery
        loadImages();
        
        // Recalculate layout on window resize
        window.addEventListener('resize', function() {
            const items = document.querySelectorAll('.gallery-item');
            items.forEach(item => {
                const img = item.querySelector('img');
                const height = img.height;
                const width = img.width;
                const rowSpan = Math.ceil((kSpanMultiplier * height / width) );
                item.style.gridRowEnd = `span ${rowSpan}`;
            });
        });
    });
</script>
