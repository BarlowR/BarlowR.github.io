{% assign base_path = page.url | split: "/" %}
{% assign img_path = base_path | join: "/" | replace: base_path.last, include.path %}
{% assign img_name = include.path | split: "." | first %}
{% assign img_ext = include.path | split: "." | last %}

<a href="{{ img_path }}">
    <picture>
        <!-- WebP format for modern browsers -->
        <source srcset="{{ img_name }}.webp" type="image/webp">
        <!-- Fallback to original format -->
        <img src="{{ img_path }}"
             loading="lazy"
             decoding="async"
             style="width: 20%; margin: 10px;{{ include.style }}"
             alt="{{ include.alt | default: 'Image' }}">
    </picture>
</a>
